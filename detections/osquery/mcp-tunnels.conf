{
  "_comment": "mcp-tunnels :: osquery pack for MCP server, bridge and tunnel discovery. Adjust intervals for your fleet size.",
  "schedule": {
    "mcp_loopback_listeners": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, l.address, l.port, u.username FROM listening_ports l JOIN processes p ON l.pid = p.pid LEFT JOIN users u ON p.uid = u.uid WHERE l.address IN ('127.0.0.1','::1') AND l.port != 0;",
      "interval": 300,
      "description": "T2 input. Loopback listeners are candidate MCP servers invisible to any network scan."
    },
    "mcp_tunnel_processes": {
      "query": "SELECT pid, name, path, cmdline, start_time, parent FROM processes WHERE name IN ('cloudflared','ngrok','frpc','bore','devtunnel','localtunnel') OR cmdline LIKE '%mcp-remote%' OR cmdline LIKE '%supergateway%' OR cmdline LIKE '%mcp-proxy%' OR cmdline LIKE '%tunnel --url%' OR cmdline LIKE '%ssh%-R%';",
      "interval": 300,
      "description": "T1/T2. Reverse tunnel agents and stdio-to-HTTP MCP bridges."
    },
    "mcp_client_configs": {
      "query": "SELECT path, size, mtime, sha256 FROM file JOIN hash USING (path) WHERE path LIKE '/home/%/.cursor/mcp.json' OR path LIKE '/home/%/.claude.json' OR path LIKE '/home/%/.claude/%.json' OR path LIKE '/home/%/.config/Code/User/mcp.json' OR path LIKE '/home/%/.codeium/windsurf/mcp_config.json';",
      "interval": 3600,
      "description": "T1/T3. Declared MCP server inventory with hashes for drift detection. The only reliable inventory of stdio servers."
    },
    "mcp_outbound_to_tunnels": {
      "query": "SELECT s.pid, p.name, p.cmdline, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p ON s.pid = p.pid WHERE s.remote_port IN (7844, 443) AND p.name IN ('cloudflared','ngrok','tailscaled','frpc','devtunnel');",
      "interval": 300,
      "description": "T2. Established sessions owned by tunnel agents. Port 7844 is the cloudflared control plane."
    }
  }
}
